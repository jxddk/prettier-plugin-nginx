name: Publish to NPM
on:
  push:
    branches:
      - master
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "prettier-plugin-nginx@$version" version 2>/dev/null || true)
          echo "publish=$([ -z "$published" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
