# contrived: runs of blank lines, blank lines at block edges, comment paragraphs

user             www;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include  mime.types;

    # attached to the next block
    server {
        listen 80;
    }
    # attached to the previous block

    server {
        listen 81;
    }

    # detached paragraph

    sendfile on;
}
