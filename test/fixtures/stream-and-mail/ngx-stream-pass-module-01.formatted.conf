# source: https://nginx.org/en/docs/stream/ngx_stream_pass_module.html

http {
    server {
        listen 8000;

        location / {
            root html;
        }
    }
}

stream {
    server {
        listen              12345 ssl;

        ssl_certificate     domain.crt;
        ssl_certificate_key domain.key;

        pass                127.0.0.1:8000;
    }
}
