# contrived: stream and mail contexts with a health-check match block and escapes
stream {
    upstream backend { server 127.0.0.1:12345; }
    match http { send "GET / HTTP/1.0\r\nHost: localhost\r\n\r\n"; expect ~* "200 OK"; }
    map $ssl_preread_server_name $name { example.com backend; default backend; }
    server {
        listen 12345 ssl proxy_protocol;
        ssl_preread on;
        proxy_pass $name;
        health_check match=http;
        log_by_lua_block { ngx.log(ngx.INFO, "bye") }
    }
}
mail {
    server_name mail.example.com;
    auth_http localhost:9000/cgi-bin/nginxauth.cgi;
    server { listen 25; protocol smtp; smtp_auth login plain cram-md5; }
}
