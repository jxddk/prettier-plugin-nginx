# contrived: quotes, escapes and multi-line strings in every position
add_header       X-A "it's a { brace; # not a comment }";
add_header       X-B 'say "hi" \' and \\ back';
return           200 "hi # not a comment";
set              $x foo"bar"'baz';
set              $y a\ b\;c\#d;
check_http_send  "HEAD / HTTP/1.1\r\n\r\n";
return           200 '
    trailing spaces   
	tab	inside
';

location "~ ^/x{2}$" {
    root /x;
}

if ($x ~ "a b") {
    return 1;
}

log_format       m escape=json '{"a":"$x"}';
more_set_headers -s 404 -t 'text/html' 'X-Foo: Bar';
content_by_lua   '
    local s = [[ } ]]
    ngx.say("}")
';
