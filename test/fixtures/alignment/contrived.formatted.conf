# contrived: names on both sides of the half-width limit, bare and block directives, an ignored line
a                                        1;
abcdefghijklmnopqrstuvwxyzabcdefghijklmn 2;
abcdefghijklmnopqrstuvwxyzabcdefghijklmno 3;
bare;

block x {
    y 1;
}

# prettier-ignore
ignored_directive_with_a_long_name        4;

map $a $b {
    default 0;
    "~*a very long quoted key that ends beyond the middle" 1;
    k       2;
}
