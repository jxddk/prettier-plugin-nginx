# contrived: map, geo, split_clients, types and charset_map with unusual keys
map $http_host $name {
    hostnames;
    volatile;
    default 0;
    include map.conf;
    "~*^(?:www\.)?example\.com$" 1;
    ~^api\. 2;
    example.org 3;
}
geo $remote_addr $geo { ranges; default 0; 10.0.0.0-10.0.0.255 1; delete 127.0.0.0/16; }
split_clients "${remote_addr}AAA" $variant { 0.5% .one; 2.0% .two; * ""; }
types { text/html html htm shtml; application/octet-stream bin exe dll; }
charset_map koi8-r utf-8 { }
charset_map utf-8 koi8-r { C0 D18E; C1 D0B0 ; }
