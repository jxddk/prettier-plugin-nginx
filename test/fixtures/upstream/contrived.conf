# contrived: bare directives, long server lines and every balancing method
upstream backend {
    zone upstream_backend 64k;
    hash $request_uri consistent;
    least_conn;
    server backend1.example.com:8080 weight=5 max_fails=3 fail_timeout=30s max_conns=100 slow_start=30s;
    server unix:/tmp/backend3 backup;
    server 192.0.2.1 down;
    keepalive 32;
    keepalive_requests 1000;
    sticky cookie srv_id expires=1h domain=.example.com httponly secure path=/;
}
