# contrived: every modifier, quoted regular expressions with braces, glued and named locations
location = / { root /a; }
location ^~ /images/ { root /b; }
location ~* \.(gif|jpg|jpeg)$ { root /c; }
location ~ "^/x{2}$" { root /d; }
location "~ ^/y{2}$" { root /e; }
location =/glued { root /f; }
location /a#b { root /g; }
location @named { proxy_pass http://backend; }
location ~ ^/users/(.+\.(?:gif|jpe?g|png))$ { alias /data/w3/images/$1; }
server_name ~^(?<name>.+)\.example\.com$ *.example.org .example.net;
rewrite ^/(.*)$ /$1 break;
